<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duztec Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/static/duztec-mark.png">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/static/duztec-logo.png" alt="Duztec Engineering Pvt. Ltd." class="logo">
    <div>
      <div class="tagline">Clean up the Air · Sales CRM</div>
      <h1 id="page-title">Sales Dashboard</h1>
    </div>
  </div>
  <div class="user-chip hidden" id="user-chip"><span id="user-email"></span> <button class="btn small" id="btn-logout">Logout</button></div>
  <nav class="nav-tabs" id="nav">
    <button data-view="dash" class="active">Dashboard</button>
    <button data-view="enquiries">Enquiries</button>
    <button data-view="quotes">Quotations</button>
    <button data-view="orders">Orders</button>
    <button data-view="lost">Lost</button>
    <button data-view="customers">Customers</button>
    <button data-view="products">Products</button>
    <button data-view="followups">Follow-ups</button>
    <button data-view="targets" id="nav-targets" class="hidden">Targets</button>
    <button data-view="users" id="nav-users" class="hidden">Users</button>
  </nav>
</header>

<main class="container">
  <div id="error-box" class="banner error hidden"></div>
  <div id="ok-box" class="banner fresh hidden"></div>
  <div id="view"></div>
</main>

<footer class="footer"><span id="footer-text">Duztec Engineering Pvt. Ltd.</span> · Sales CRM (internal)</footer>

<div id="login-overlay" class="login-overlay hidden">
  <div class="login-card">
    <img src="/static/duztec-logo.png" alt="Duztec Engineering" style="height:52px">
    <h2 style="margin:14px 0 4px">Sales CRM Login</h2>
    <p class="muted small" style="margin:0 0 14px">Sign in with your <b>@duztec.in</b> email (or a registered admin email) and password.</p>
    <div id="login-step1">
      <label class="muted small">Email</label>
      <input id="login-email" type="email" placeholder="yourname@duztec.in" autocomplete="username">
      <label class="muted small" style="display:block;margin-top:8px">Password</label>
      <input id="login-password" type="password" autocomplete="current-password">
      <button class="btn primary" id="login-submit" style="width:100%;margin-top:10px">Log in</button>
      <button class="btn" id="login-forgot" style="width:100%;margin-top:6px">First login / Forgot password</button>
    </div>
    <div id="login-step2" class="hidden">
      <p class="muted small" style="margin:0 0 8px">We will email a 6-digit code to <b id="login-sent-to"></b> to confirm it is you, then you can choose a password.</p>
      <button class="btn primary" id="login-send" style="width:100%">Send Code</button>
      <div id="login-reset-fields" class="hidden">
        <label class="muted small" style="display:block;margin-top:10px">6-digit code</label>
        <input id="login-code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" style="letter-spacing:6px;text-align:center;font-size:20px">
        <label class="muted small" style="display:block;margin-top:8px">New password (at least 8 characters)</label>
        <input id="login-new-pw" type="password" autocomplete="new-password">
        <label class="muted small" style="display:block;margin-top:8px">Confirm new password</label>
        <input id="login-new-pw2" type="password" autocomplete="new-password">
        <button class="btn primary" id="login-set-pw" style="width:100%;margin-top:10px">Set Password &amp; Log in</button>
      </div>
      <button class="btn" id="login-back" style="width:100%;margin-top:6px">Back to login</button>
    </div>
    <div id="login-msg" class="muted small" style="margin-top:10px;min-height:18px"></div>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modal-title">—</h2><button class="btn" id="modal-close">Close</button></div>
    <div class="modal-body" id="modal-body" style="padding:14px 18px"></div>
  </div>
</div>

<script src="/charts.js"></script>
<script src="/crm.js"></script>
</body>
</html>
