  admin_emails:                      # seeded as admins on startup; admins manage other users
    - "office@duztec.in"
    - "vasanirs@duztec.in"
    - "abhishek.ghumare@lechlerindia.com"   # allowed as an explicit exception to the domain rule
  rkz_codes:                         # optional RKZ seed for known users (admins can edit in the Users tab)
    "vasanirs@duztec.in": "RV"
  session_hours: 168                 # login valid for 7 days per device
  otp_minutes: 10                    # OTP validity
  smtp:                              # fill these to send OTPs by email (e.g. Zoho/Google Workspace SMTP)
    host: ""                         # e.g. smtp.zoho.in — EMPTY = dev mode: OTP appears in the server log
    port: 587
    username: ""
    password: ""
    from_addr: "Duztec CRM <office@duztec.in>"
