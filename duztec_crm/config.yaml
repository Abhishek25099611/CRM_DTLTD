# Duztec CRM — Sales (Enquiries / Quotations / Orders)
app:
  host: "127.0.0.1"
  port: 8016
  company_name: "Duztec Engineering Pvt. Ltd."
  tagline: "Clean up the Air · Sales CRM"

company:                       # used on the quotation letterhead — CONFIRM with accounts
  address: "Plot No. A-109, Wagle Industrial Estate, Road No. 18, Wagle Estate MIDC, Thane - 400604, India"
  cin: "U29300MH2018PTC317218"
  gstin: "27XXXXXXXXXXXXX"     # <-- placeholder, replace with real GSTIN
  email: "sales@duztec.in"
  phone: ""
  home_state: "Maharashtra"    # intra-state => CGST+SGST, else IGST
  bank_details: "Bank: ____ · A/c No: ____ · IFSC: ____ · Branch: ____"

numbering:
  enquiry_prefix: "ENQ-2627-"  # ENQ-2627-001 ...
  quote_prefix: "Q"            # Q00493 ...
  quote_pad: 5
  quote_start: 493             # first quotation number on a fresh database (never goes below this)

enquiry_types: [Normal, Tender, Budgetary, Supporting, Repeat Order]   # "Enquiry Type" on the form; copied to the quotation

quotation_defaults:
  validity_days: 30
  gst_pct: 18
  delivery_terms: "8-10 weeks from technically & commercially clear PO"
  payment_terms: "50% advance, 50% before dispatch"
  notes: "Freight, transit insurance and unloading at site are in buyer's scope unless stated."
  # Pre-filled text sections; edit per quotation. Multi-line text is allowed (use | in YAML).
  introduction: |
    Duztec Engineering Pvt. Ltd. designs and manufactures dust-suppression and industrial cleaning systems
    for steel, cement, mining and power plants across India. We thank you for your enquiry and are pleased
    to submit our technical and commercial offer as under.
  scope: |
    Design, manufacture, supply, testing and commissioning of the equipment listed above, including standard
    accessories and documentation. Civil work, power supply at site, water supply and any items not
    expressly listed are excluded.
  warranty: |
    12 months from the date of commissioning or 18 months from the date of dispatch, whichever is earlier,
    against manufacturing defects. Consumables and damage due to misuse are not covered.
  guarantee: |
    Performance as per the agreed technical specification, subject to operation within the stated design
    parameters and site conditions.

uploads:                          # customer documents, PO PDFs, quotation attachments
  max_mb: 25
  allowed_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, png, jpg, jpeg, dwg, dxf, zip]
  categories: [Offer received, Costing sheet, Technical document, Customer requirement, Drawing,
               Reference document, Customer PO, Other]

products_seed:                    # inserted ONCE when the Products master is empty; maintain in the Products tab afterwards.
  # HSN 8424 = mechanical appliances for projecting/dispersing liquids; 9987 = installation services. CONFIRM with accounts.
  - { code: MB-50,    name: "MB-50 Mist Cannon",                        hsn: "8424" }
  - { code: MB-60,    name: "MB-60 Mist Cannon",                        hsn: "8424" }
  - { code: MB-80,    name: "MB-80 Mist Cannon",                        hsn: "8424" }
  - { code: TWG-50,   name: "TWG-50 Truck-mounted Water Gun",           hsn: "8424" }
  - { code: DB-30,    name: "DB-30 Dust Buster",                        hsn: "8424" }
  - { code: DB-40,    name: "DB-40 Dust Buster",                        hsn: "8424" }
  - { code: SFDS,     name: "SFDS Single Fluid Dust Suppression System", hsn: "8424" }
  - { code: EVAP-600, name: "EVAP-600 Evaporator",                      hsn: "8424" }
  - { code: SPARES,   name: "Spares & consumables",                     hsn: "8424" }
  - { code: SERVICE,  name: "Installation & commissioning",             hsn: "9987", unit: "Lot" }

targets:                          # sales targets per user (admin sets; engineer sees own)
  default_measure: order_value    # order_value | order_count | quotation_value | quotation_count | enquiry_count
  financial_year_start_month: 4   # yearly targets run Apr–Mar

presence:                         # Users tab status from the browser heartbeat
  active_minutes: 5               # seen within 5 min  -> Active
  idle_minutes: 30                # seen within 30 min -> Idle, else Out

sla:                              # enquiry -> quotation turnaround (working hours)
  quote_within_hours: 48
  work_start_hour: 9
  work_end_hour: 18
  work_days: [0, 1, 2, 3, 4, 5]   # Mon=0 ... Sat=5 (Sunday excluded)

paths:
  db: "./data/crm.db"
  uploads: "./data/uploads"
  logs: "./data/logs"
  backup: "./data/backup"
  mis_file: "../MIS 2026-27.xlsx"   # one-time import source

